<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="stylesheet.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=IM+Fell+English+SC&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>My Library</h1>
    <p>A quiet sanctuary for forgotten stories, worn pages, and thoughts that linger long after the candle burns low. Here, among the dust and shadows, every book keeps a secret—and every reader is invited to uncover it.</p>
    <button onclick="showAddBookFormModal()">New Book</button>
    <dialog id="add-book-form">
         <h2>Add a Book!</h2>
         <form id="book-form">
            <label for="title">Title</label>
            <input type="text" id="title" name="title">

            <label for="author">Author</label>
            <input type="text" id="author" name="author">

            <label for="pages">Pages</label>
            <input type="text" id="pages" name="pages">

            <input type="checkbox" class="read-status-toogle" id="read" name="read">
            <label for="read" class="read-toogle-container">
                <div class="toogle-item">Read</div> 
                <div class="toogle-item">Not read yet</div>
            </label>

            <button type="submit">Add Book</button>
            <button onClick="closeAddBookForm()" type="button">Cancel</button>
         </form>
    </dialog>
    <div id="library-container"></div>
    <script src="script.js"></script>
</body>
</html>
